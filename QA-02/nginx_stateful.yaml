---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nginx-storage-pv
spec:
  capacity:
    storage: 8Gi
  volumeMode: Filesystem
  accessModes:
    - ReadOnlyMany
  storageClassName: standard
  local:
    path: /mnt/nginx-storage
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: Exists
  # hostPath:
  #   path: "/tmp/nginx-storage"    
